<style>
/* Layout: một cột kiểu app, mỗi màn một câu hỏi; cuối cùng là bản tóm tắt xếp theo mẫu ICP để sao chép */
:root{
  --paper:#F7F5EF; --card:#FFFFFF; --ink:#1B2A4A; --muted:#55617A; --line:#E1E5EC;
  --teal:#1D9E75; --teal-soft:#E1F5EE; --teal-mid:#9FE1CB; --amber:#F2B04D; --amber-soft:#FDF1DC; --amber-ink:#7A4E0C; --focus:#1D9E75;
  --f-display:"Lexend","Be Vietnam Pro","Segoe UI",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#101624; --card:#182235; --ink:#E6ECF5; --muted:#A3B0C6; --line:#2A3650;
  --teal:#5DCAA5; --teal-soft:#15322B; --teal-mid:#1F5747; --amber:#F2B04D; --amber-soft:#3A2C14; --amber-ink:#FAC775; --focus:#5DCAA5; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#101624; --card:#182235; --ink:#E6ECF5; --muted:#A3B0C6; --line:#2A3650;
  --teal:#5DCAA5; --teal-soft:#15322B; --teal-mid:#1F5747; --amber:#F2B04D; --amber-soft:#3A2C14; --amber-ink:#FAC775; --focus:#5DCAA5; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;padding-inline:16px;padding-block:20px 48px}
.app{max-width:600px;margin:0 auto;display:grid;gap:16px}
header{display:flex;gap:12px;align-items:center}
.brand{font-family:var(--f-display);font-weight:600;font-size:19px;line-height:1.25}
.brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:13px;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--teal);width:0;transition:width .3s}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px 20px;display:grid;gap:14px;min-width:0}
.part{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);font-weight:600}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(21px,5vw,25px);line-height:1.3;margin:0;text-wrap:balance}
.lead{color:var(--muted);margin:0}
.opt-tag{font-size:12px;color:var(--amber-ink);background:var(--amber-soft);border-radius:6px;padding:1px 7px;justify-self:start}
textarea,input[type="text"],select{font:inherit;width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card);color:var(--ink)}
textarea{min-height:150px;resize:vertical}
textarea:focus,input:focus,select:focus,button:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.grid2{grid-template-columns:1fr}}
label{font-weight:600;font-size:14.5px;display:grid;gap:6px}
.row{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:12px 20px;background:var(--teal);color:#fff;cursor:pointer}
.ghost{font:inherit;border:0;background:none;color:var(--muted);cursor:pointer;padding:8px 4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:14.5px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;cursor:pointer}
.chip{text-align:left}
.chip[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft);font-weight:600}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:15px}
.check input{margin-top:5px;accent-color:var(--teal)}
.err{color:#C0472B;font-size:13.5px;margin:0}
.sum h2{font-family:var(--f-display);font-size:16px;font-weight:600;margin:14px 0 4px}
.sum p{margin:0 0 8px;white-space:pre-wrap;overflow-wrap:anywhere}
.sum .q{font-size:13.5px;color:var(--muted);margin:0}
.sum .empty{color:var(--muted);font-style:italic}
.out{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:4px 16px 12px;max-height:520px;overflow:auto}
.ok{color:var(--teal);font-size:14px;margin:0}
.home{font-size:13.5px;font-weight:600;color:var(--teal);text-decoration:none;border:1.5px solid var(--teal-mid);border-radius:999px;padding:6px 12px;white-space:nowrap}
.home:hover{background:var(--teal-soft)}
.voice{border:1px dashed var(--teal-mid);border-radius:12px;background:var(--teal-soft)}
.voice summary{cursor:pointer;padding:10px 14px;font-weight:600;font-size:14.5px;color:var(--teal);display:flex;align-items:center;gap:8px;list-style:none}
.voice summary::-webkit-details-marker{display:none}
.voice summary svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.voice-body{padding:0 14px 12px;font-size:14.5px}
.voice-body p{margin:0 0 6px}
.voice-body ul{margin:0 0 6px;padding-left:18px}
.foot{font-size:13px;color:var(--muted);text-align:center;margin:0}
.mic{font:inherit;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:1.5px dashed var(--teal);background:var(--teal-soft);color:var(--teal);border-radius:12px;padding:12px;cursor:pointer}
.mic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mic[aria-pressed="true"]{background:#C0472B;border-color:#C0472B;color:#fff}
.mic-note{font-size:13px;color:var(--muted);margin:0}
</style>
</head>

    <p class="lead">Chào bạn, mình là Alina Trần Ngọc Ánh (N5 lớp 300DNS), đại diện team hỗ trợ đã đồng hành cùng bạn những ngày vừa qua. Có thể là lúc cùng gỡ rối, dọn dẹp Notion; lúc nạp dữ liệu về bản thân; lúc làm quen với các trợ lý AI; những buổi khai vấn cùng Coach Nội Tâm để hiểu mình hơn; hay lúc cùng đặt tên cho ý tưởng, soi thị trường và viết những bài chia sẻ đầu tiên.</p>
    <p class="lead">Mỗi người đi một chặng khác nhau. Dù bạn đã đi cùng team ở chặng nào, bạn cũng chính là người mình muốn được nghe kể.</p>
    <p class="lead">Giờ team đang chuẩn bị một nền tảng mang tên WI.DUO, để những người đi sau, trong lớp và cả ngoài lớp, cũng có một người ngồi cùng như thế. Bạn là người hiểu rõ nhất sự hỗ trợ ấy đã giúp được gì, và chỗ nào còn chưa ổn. Mình muốn nghe đúng lời bạn, kể cả điều bạn chưa hài lòng, để chỉnh lại cách đồng hành cho người đến sau.</p>
    <p class="lead">Không có câu trả lời đúng hay sai. Bạn cứ kể tự nhiên, như đang ngồi uống trà với nhau.</p>
    <label>Tên bạn muốn được gọi<input type="text" id="nm" value="${esc(st.name)}" placeholder="Ví dụ: chị Lương Hạnh" autocomplete="name"></label>
    <p class="lead" style="font-size:14.5px">11 câu hỏi · khoảng 10 phút · gõ hoặc nói đều được.</p>
    <label class="check"><input type="checkbox" id="cs" ${st.consent?"checked":""}> Tôi đồng ý để người phỏng vấn dùng câu trả lời này để hiểu khách hàng và liên hệ lại với tôi. Lời của tôi chỉ được trích công khai khi tôi đồng ý thêm một lần nữa.</label>
    <p class="err" id="er" hidden></p>
    <div class="row"><span></span><button class="btn" id="go">Bắt đầu</button></div></section>`;
  $("#nm").oninput=e=>{st.name=e.target.value;save()};
  $("#cs").onchange=e=>{st.consent=e.target.checked;$("#er").hidden=true;save()};
  $("#go").onclick=()=>{if(!st.consent){$("#er").textContent="Đánh dấu ô đồng ý ở trên để bắt đầu.";$("#er").hidden=false;return}st.i=0;save();render()};
}

function question(){
  const L=list(), q=L[st.i];
  const body = q.demo ? `<div class="grid2">${DEMO.map(f=>f.text
      ? `<label>${f.l}${f.req?" *":""}<input type="${f.type||"text"}" data-d="${f.k}" value="${esc(st.d[f.k])}" ${f.req?'aria-required="true"':""}></label>`
      : `<label>${f.l}${f.req?" *":""}<select data-d="${f.k}" ${f.req?'aria-required="true"':""}><option value="">Chọn…</option>${f.opts.map(o=>`<option ${st.d[f.k]===o?"selected":""}>${o}</option>`).join("")}</select></label>`).join("")}</div>
      <p class="err" id="derr" hidden></p>`
    : `${q.chips?`<div class="chips">${q.chips.map((c,k)=>`<button class="chip" data-c="${k}" aria-pressed="${((st.c||{})[q.id]||[]).includes(c)}">${c}</button>`).join("")}</div>`:""}
       <textarea id="ans" aria-label="Câu trả lời của bạn" placeholder="${q.chips?"Hoặc bạn mô tả theo cách của mình…":"Bạn cứ viết hoặc nói như đang kể cho một người bạn…"}">${esc(st.a[q.id])}</textarea>
       ${SR?`<button class="mic" id="mic" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span>Bấm để nói</span></button>
       <p class="mic-note" id="micnote">Bấm nút, cho phép dùng micro, rồi nói tiếng Việt bình thường. Bấm lần nữa để dừng.</p>`:""}
       <details class="voice"${SR?' hidden':''}><summary><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>Muốn nói thay vì gõ?</summary>
       <div class="voice-body"><p>Bấm vào ô trả lời ở trên, rồi bật micro của chính bàn phím:</p>
       <ul><li><b>Điện thoại Android:</b> bấm biểu tượng micro trên bàn phím Gboard.</li>
       <li><b>iPhone:</b> bấm biểu tượng micro cạnh phím cách.</li>
       <li><b>Máy tính Windows:</b> nhấn phím Windows + H.</li>
       <li><b>Máy Mac:</b> nhấn phím Fn hai lần (hoặc phím micro).</li></ul>
       <p>Bạn nói tiếng Việt bình thường, chữ sẽ tự hiện vào ô. Nói xong đọc lại, sửa vài chữ máy nghe nhầm là được.</p></div></details>`;
  screen.innerHTML=`<section class="card">
    <span class="part">Phần ${q.p+1} · ${PARTS[q.p]}</span>
    <h1>${q.t}</h1>
    ${q.h?`<p class="lead">${q.h}</p>`:""}
    ${q.opt?`<span class="opt-tag">Không bắt buộc</span>`:""}
    ${body}
    <div class="row"><button class="ghost" id="bk">← ${st.i===0?"Lời mở đầu":"Câu trước"}</button>
      <div style="display:flex;gap:8px;align-items:center">${q.opt||q.demo?"":`<button class="ghost" id="sk">Bỏ qua</button>`}<button class="btn" id="nx">${st.i===L.length-1?"Xem bản tổng hợp":"Câu tiếp"}</button></div></div></section>`;
  const ta=$("#ans"); if(ta){ta.oninput=e=>{st.a[q.id]=e.target.value;save()}; if(!q.chips) ta.focus({preventScroll:true})}
  const mic=$("#mic");
  if(mic&&ta) mic.onclick=()=>{
    if(rec){rec.stop();return}
    rec=new SR(); rec.lang="vi-VN"; rec.continuous=true; rec.interimResults=true;
    const base=ta.value?ta.value.replace(/\s*$/," "):""; let finalTxt="";
    rec.onresult=e=>{let interim="";for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)finalTxt+=r[0].transcript+" ";else interim+=r[0].transcript}
      ta.value=base+finalTxt+interim; st.a[q.id]=ta.value; save()};
    rec.onerror=e=>{$("#micnote").textContent=e.error==="not-allowed"?"Máy chưa cho dùng micro. Bạn cho phép micro trong trình duyệt, hoặc dùng nút micro trên bàn phím điện thoại.":"Micro tạm dừng. Bạn bấm lại để nói tiếp."};
    rec.onend=()=>{rec=null;mic.setAttribute("aria-pressed","false");mic.querySelector("span").textContent="Bấm để nói"};
    rec.start(); mic.setAttribute("aria-pressed","true"); mic.querySelector("span").textContent="Đang nghe… bấm để dừng";
  };
  screen.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{
    st.c=st.c||{}; const cur=st.c[q.id]||[], v=q.chips[+b.dataset.c];
    st.c[q.id]=cur.includes(v)?cur.filter(x=>x!==v):(q.one?[v]:cur.concat(v));
    screen.querySelectorAll("[data-c]").forEach(x=>x.setAttribute("aria-pressed",st.c[q.id].includes(q.chips[+x.dataset.c]))); save();
  });
  screen.querySelectorAll("[data-d]").forEach(el=>el.oninput=el.onchange=e=>{st.d[el.dataset.d]=e.target.value;save();const de=$("#derr");if(de)de.hidden=true});
  $("#bk").onclick=()=>{st.i--;save();render()};
  const sk=$("#sk"); if(sk) sk.onclick=()=>{st.i++;save();render()};
  $("#nx").onclick=()=>{
    if(q.demo){ const miss=DEMO.filter(f=>f.req && !String(st.d[f.k]||"").trim()).map(f=>f.l.replace(/ \(.*\)$/,"").toLowerCase());
      if(miss.length){const de=$("#derr");de.textContent="Bạn điền giúp: "+miss.join(", ")+".";de.hidden=false;return} }
    st.i++;save();render()};
}

function summaryText(){
  const L=list(), groups={};
  L.forEach(q=>{ if(q.demo) return; const picks=((st.c||{})[q.id]||[]); let a=(st.a[q.id]||"").trim();
    if(picks.length) a="Chọn: "+picks.join("; ")+(a?"\n"+a:""); if(!a) return;
    q.icp.forEach(k=>{(groups[k]=groups[k]||[]).push({q:q.t,a})}) });
  const demo=DEMO.filter(f=>!f.c).map(f=>st.d[f.k]?`${f.l}: ${st.d[f.k]}`:"").filter(Boolean);
  const contact=DEMO.filter(f=>f.c).map(f=>st.d[f.k]?`${f.l.replace(/ \(.*\)$/,"")}: ${st.d[f.k]}`:"").filter(Boolean);
  const order=["0. Đã được gỡ rối","1.1 Nhân khẩu học","1.2 Mức sẵn sàng đầu tư","2. Fact","3. Mục tiêu & giá trị","4. Nỗi đau","5. Trở ngại & phản đối","6. Phải / Có thể / Không nên","7. Lý do thật sự","8.1 Phát sinh nhu cầu","8.2 Cân nhắc","8.3 Touchpoint","8.4 Quyết định","8.5 Sử dụng","8.6 Trung thành & giới thiệu","9. Ngôn ngữ thật","10. Gợi ý cách bắt đầu"];
  let txt=`BÊN CHÉN TRÀ KỂ CHUYỆN · WI.DUO\nNgười kể: ${st.name||"(chưa ghi tên)"}\nĐồng ý dùng để hiểu khách hàng: có\n`;
  let html="";
  const give=((st.c||{}).q16c||[])[0], qg=Q.find(q=>q.id==="q16c");
  if(give && qg.chips.indexOf(give)<2){
    txt+=`\n★ SẴN SÀNG ĐỒNG HÀNH, TRAO GIỜ HỖ TRỢ NGƯỜI ĐI SAU (${give})\n`;
    html+=`<p style="background:#FDF1DC;border-left:4px solid #F2B04D;padding:10px 14px;border-radius:8px;font-weight:600;margin:0 0 12px">★ Sẵn sàng đồng hành, trao giờ hỗ trợ người đi sau<br><span style="font-weight:400">${esc(give)}</span></p>`;
  }
  if(contact.length){ txt+=`\n[Liên hệ]\n`+contact.join("\n")+"\n"; html+=`<h2>Liên hệ</h2>`+contact.map(d=>`<p>${esc(d)}</p>`).join("") }
  order.forEach(k=>{
    if(k==="1.1 Nhân khẩu học"){ txt+=`\n[${k}]\n`+(demo.length?demo.join("\n"):"(bỏ trống)")+"\n";
      html+=`<h2>${k}</h2>`+(demo.length?demo.map(d=>`<p>${esc(d)}</p>`).join(""):`<p class="empty">Bỏ trống</p>`); return }
    const g=groups[k]; if(!g) return;
    txt+=`\n[${k}]\n`+g.map(x=>`• ${x.q}\n  "${x.a}"`).join("\n")+"\n";
    html+=`<h2>${k}</h2>`+g.map(x=>`<p class="q">${esc(x.q)}</p><p>“${esc(x.a)}”</p>`).join("");
  });
  return {txt,html,give:(give && qg.chips.indexOf(give)<2)};
}

function rowData(txt,star){
  const pick=id=>((st.c||{})[id]||[]).join("; "), ans=id=>(st.a[id]||"").trim(), d=k=>st.d[k]||"";
  return [
    ["Thời gian", new Date().toLocaleString("vi-VN")],
    ["Tên", st.name||""],
    ["★ Sẵn sàng đồng hành", star?"★":""],
    ["1. Đã được gỡ rối (chọn)", pick("q0")], ["1. Kể thêm", ans("q0")],
    ["2. Hồi trước loay hoay thế nào", ans("q1")],
    ["3. Khó nhất / có định bỏ cuộc", ans("q3")],
    ["4. Ngần ngại trước khi đồng ý", ans("q7")],
    ["5. Làm được gì sau hỗ trợ", ans("q11")],
    ["6. Nói với bạn bè", ans("q12")],
    ["7. Mục tiêu 3–6 tháng, 1–3 năm", ans("q14")],
    ["8. Cách nhận hỗ trợ thoải mái (chọn)", pick("q7b")], ["8. Kể thêm", ans("q7b")],
    ["9. Muốn hỗ trợ bắt đầu thế nào (chọn)", pick("q16b")], ["9. Kể thêm", ans("q16b")],
    ["10. Sẵn sàng chia sẻ lại (chọn)", pick("q16c")], ["10. Kể thêm", ans("q16c")],
    ["Giới tính", d("gender")], ["Độ tuổi", d("age")], ["Nơi sống", d("place")], ["Nghề / chuyên môn", d("job")],
    ["Gia đình", d("family")], ["Thu nhập", d("income")], ["Zalo", d("zalo")], ["Email", d("email")], ["Facebook", d("fb")],
    ["Bản tổng hợp", txt]
  ];
}

function done(){
  const {txt,html,give}=summaryText();
  screen.innerHTML=`<section class="card">
    <span class="part">Bước cuối</span>
    <h1>Chén trà của bạn đã đầy. Cảm ơn bạn đã kể.</h1>
    <p class="lead">Dưới đây là câu trả lời của bạn. Bạn đọc lại một lượt, rồi bấm “Gửi cho team” là xong.</p>
    <div class="out sum">${html||'<p class="empty">Bạn chưa trả lời câu nào.</p>'}</div>
    <p class="ok" id="ok" hidden></p>
    <p class="err" id="se" hidden></p>
    <textarea id="raw" readonly hidden aria-label="Bản tóm tắt để sao chép">${esc(txt)}</textarea>
    <div class="row"><button class="ghost" id="bk">← Sửa câu trả lời</button><button class="btn" id="sd">${st.sent?"Đã gửi ✓":"Gửi cho team"}</button></div>
    <div class="row"><span class="mic-note">Không gửi được? Bạn sao chép rồi dán qua Zalo.</span><button class="ghost" id="cp">Sao chép</button></div>
    <div class="row"><span></span><button class="ghost" id="rs">Xóa và bắt đầu lại</button></div></section>`;
  $("#bk").onclick=()=>{st.i=list().length-1;save();render()};
  $("#cp").onclick=async()=>{
    const ok=$("#ok");
    try{await navigator.clipboard.writeText(txt);ok.textContent="Đã sao chép. Giờ bạn dán vào tin nhắn là xong.";ok.hidden=false}
    catch(e){const r=$("#raw");r.hidden=false;r.style.minHeight="220px";r.focus();r.select();ok.textContent="Máy chưa cho sao chép tự động. Phần chữ bên dưới đã được chọn sẵn, bạn bấm giữ hoặc Ctrl+C để sao chép.";ok.hidden=false}
  };
  $("#sd").onclick=async()=>{
    const b=$("#sd"), ok=$("#ok"), se=$("#se"); se.hidden=true;
    if(!/^https:\/\/script\.google\.com\//.test(SHEET_URL)){se.textContent="Phiếu chưa được nối với bảng dữ liệu. Bạn bấm “Sao chép” và gửi qua Zalo giúp mình nhé.";se.hidden=false;return}
    b.disabled=true; b.textContent="Đang gửi…";
    try{
      await fetch(SHEET_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({rows:rowData(txt,give)})});
      st.sent=true; save(); b.textContent="Đã gửi ✓";
      ok.textContent="Đã gửi tới team. Cảm ơn bạn đã dành thời gian kể chuyện!"; ok.hidden=false;
    }catch(e){b.disabled=false;b.textContent="Gửi lại";se.textContent="Chưa gửi được, có thể do mạng. Bạn thử lại, hoặc bấm “Sao chép” và gửi qua Zalo.";se.hidden=false}
  };
  $("#rs").onclick=()=>{ if(!$("#rs").dataset.sure){$("#rs").dataset.sure=1;$("#rs").textContent="Bấm lần nữa để xóa hết";return}
    st={i:-1,mode:"short",a:{},c:{},d:{},name:"",consent:false};save();render()};
}

function render(){ if(rec){try{rec.stop()}catch(e){} rec=null} const n=list().length; if(st.i>n) st.i=n; progress(); if(st.i<0) intro(); else if(st.i>=n) done(); else question(); window.scrollTo({top:0}); }
render();
</script>
</body>
</html>
